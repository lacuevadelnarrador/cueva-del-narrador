<!DOCTYPE html>
<html lang="es">
<head>

<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://vxzvpucuthpvmdgmwgdk.supabase.co" crossorigin>

<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha256-WdOUh8NYmEO0EDItij1WLOAiq6HlzLFomO8/sqDaLs0=" crossorigin>

<link rel="stylesheet" href="lector.css">
<style>
/* Estilos solo de esta página (listas; los del lector están en lector.css), para no hacer crecer styles.css.
   Prefijos .leer- y .lector-; reutiliza .fila, .st, .empty, .fallo, .chip y .volver de styles.css */
.leer-flecha{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
button.volver{background:none;border:0;padding:0;font:inherit;font-size:15px;cursor:pointer;margin:0 0 6px}
.leer-h2{font-size:24px;letter-spacing:.02em;color:var(--title);margin-bottom:14px;overflow-wrap:anywhere}
.leer-h2:focus{outline:none}
.leer-h2:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.leer-lista{list-style:none;padding:0;margin:0}
.leer-lista .st b{overflow-wrap:anywhere}
.leer-etqs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.leer-etq{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.leer-etq.ok{color:var(--ent-ok);background:var(--ent-ok-bg);border-color:var(--ent-ok-bg)}
.leer-ic{width:13px;height:13px;flex:none;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.leer-cuenta{font-size:14px;color:var(--muted);margin:-6px 0 10px}
.leer-acciones{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
</style>
</head>
<body>
<div class="app">
  <header class="pagehead">
    <div class="top">
      <div class="brand">
        <img src="img/logo-arco.png" alt="Logo de La Cueva del Narrador">
        <span>La Cueva<br>del Narrador</span>
      </div>
      <div class="avatar" aria-label="Tu perfil"></div>
    </div>
    <h1>Entregas</h1>
    <p class="sub">Lee los textos de tus compañeros en los retos.</p>
  </header>

  <main class="lectura">
    <a class="volver" href="retos.html"><svg class="leer-flecha" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>Volver a Retos</a>
    <section id="vista" aria-label="Entregas de los retos"></section>
  </main>

  <!-- Leer las entregas es una subpágina de Retos: para un socio la pestaña activa es «Retos» (como en retos.html con sesión) -->
  <nav class="nav" aria-label="Navegación principal">
    <a href="inicio.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V11a8 8 0 0116 0v10M9 21v-6a3 3 0 016 0v6"/></svg>Inicio</a>
    <a href="calendario.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</a>
    <a href="curso.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v13"/></svg>Curso</a>
    <a href="retos.html" class="on" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Retos</a>
    <a href="proyecto.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4C12 4 7 9 6 16l-2 4 4-2c7-1 12-6 12-14z"/><path d="M6 16l7-7"/></svg>Proyecto</a>
    <a href="mas.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Más</a>
  </nav>
</div>

<!-- Lector a pantalla completa. Solo lectura: sin descargar, imprimir ni copiar. -->
<dialog class="lector" id="lector" aria-labelledby="lector-titulo">
  <div class="lector-barra">
    <button type="button" class="lector-volver" id="lector-volver"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>Volver</button>
    <h2 id="lector-titulo"></h2>
  </div>
  <div class="lector-cuerpo" id="lector-cuerpo" tabindex="0" aria-label="Texto de la entrega"></div>
</dialog>
<p class="leer-sin-imprimir">La impresión no está disponible en el lector de entregas.</p>

<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="campana.js"></script>
<script src="lector.js"></script>
<script src="leer.js"></script>
<script>
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
