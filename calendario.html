<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario · La Cueva del Narrador</title>
<meta name="theme-color" content="#528A93">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="pagehead">
    <div class="top">
      <div class="brand">
        <img src="img/logo-arco.png" alt="Logo de La Cueva del Narrador">
        <span>La Cueva<br>del Narrador</span>
      </div>
      <div class="avatar" aria-label="Tu perfil"></div>
    </div>
    <h1>Calendario</h1>
    <p class="sub">Clases, charlas, retos y encuentros del curso.</p>
  </header>

  <main>
    <section aria-label="Calendario mensual">
      <div class="monthbar">
        <button class="iconbtn" id="prev" aria-label="Mes anterior">&#8249;</button>
        <h2 id="titulo-mes" aria-live="polite"></h2>
        <button class="iconbtn" id="next" aria-label="Mes siguiente">&#8250;</button>
      </div>
      <div class="cal">
        <div class="dow"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
        <div class="days" id="dias"></div>
      </div>
      <div class="legend" id="leyenda"></div>
    </section>

    <section id="eventos" aria-label="Lista de eventos">
      <div class="listhead"><h2 id="titulo-lista"></h2><button class="chip" id="ver-mes" hidden>Ver todo el mes</button></div>
      <div id="lista"></div>
    </section>
  </main>

  <nav class="nav" aria-label="Navegación principal">
    <a href="inicio.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V11a8 8 0 0116 0v10M9 21v-6a3 3 0 016 0v6"/></svg>Inicio</a>
    <a href="calendario.html" class="on" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</a>
    <a href="curso.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v13"/></svg>Curso</a>
    <a href="biblioteca.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h4v18H5zM11 3h4v18h-4zM17 5l3.5 1-4 15-3.5-1z"/></svg>Biblioteca</a>
    <a href="mas.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Más</a>
  </nav>
</div>
<script src="tipos.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
let EVENTOS=[], cargado=false;
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const hoy=new Date();
let anio=hoy.getFullYear(), mes=hoy.getMonth(), sel=null;

const esc=Cueva.esc;
const clave=(a,m,d)=>a+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const partes=f=>{const p=f.split('-').map(Number);return {a:p[0],m:p[1]-1,d:p[2]};};
const orden=(x,y)=>(x.fecha+(x.hora||'')).localeCompare(y.fecha+(y.hora||''));

function eventosDe(prefijo){return EVENTOS.filter(e=>e.fecha.startsWith(prefijo)).sort(orden);}

function pintarLeyenda(){
  document.getElementById('leyenda').innerHTML=Object.values(TIPOS).map(t=>'<span><i style="background:'+t.c+'"></i>'+t.n+'</span>').join('');
}

// Enlaces de interés de un evento (ya filtrados: formato URL y https://). Sin enlaces, no se añade nada.
function pintarEnlaces(enlaces){
  if(!enlaces||!enlaces.length) return '';
  return '<ul class="enlaces" aria-label="Enlaces de interés">'+enlaces.map(d=>'<li><a href="'+esc(d.url)+'" target="_blank" rel="noopener noreferrer">'+esc(d.nombre)+'</a></li>').join('')+'</ul>';
}

function pintar(){
  document.getElementById('titulo-mes').textContent=MESES[mes]+' '+anio;
  const prefMes=anio+'-'+String(mes+1).padStart(2,'0');
  const delMes=eventosDe(prefMes);
  const primero=(new Date(anio,mes,1).getDay()+6)%7;
  const total=new Date(anio,mes+1,0).getDate();
  let h='';
  for(let i=0;i<primero;i++) h+='<span class="day blank"></span>';
  for(let d=1;d<=total;d++){
    const k=clave(anio,mes,d);
    const evs=delMes.filter(e=>e.fecha===k);
    const tipos=[...new Set(evs.map(e=>e.tipo))];
    let estilo='', extra='';
    if(tipos.length===1){const t=tipo(tipos[0]);estilo=' style="background:'+t.c+';color:'+t.t+'"';extra=' has';}
    else if(tipos.length>1){const paso=100/tipos.length;estilo=' style="background:linear-gradient(90deg,'+tipos.map((x,i)=>tipo(x).c+' '+(i*paso)+'% '+((i+1)*paso)+'%').join(',')+')"';extra=' has multi';}
    const esHoy=(anio===hoy.getFullYear()&&mes===hoy.getMonth()&&d===hoy.getDate());
    const cls='day'+extra+(esHoy?' today':'')+(sel===k?' sel':'');
    const label=d+' de '+MESES[mes]+(evs.length?', '+evs.length+(evs.length===1?' evento':' eventos'):'')+(esHoy?', hoy':'');
    h+='<button class="'+cls+'"'+estilo+' data-k="'+k+'" aria-label="'+label+'"'+(sel===k?' aria-pressed="true"':'')+'><span class="num">'+d+'</span></button>';
  }
  document.getElementById('dias').innerHTML=h;

  const lista=sel?delMes.filter(e=>e.fecha===sel):delMes;
  const tl=document.getElementById('titulo-lista');
  if(sel){const p=partes(sel);tl.textContent=p.d+' de '+MESES[p.m];} else tl.textContent='Eventos de '+MESES[mes].toLowerCase();
  document.getElementById('ver-mes').hidden=!sel;
  if(!cargado) return; // mientras carga (o si falla), la lista muestra el aviso
  document.getElementById('lista').innerHTML=lista.length?lista.map(e=>{
    const p=partes(e.fecha), t=tipo(e.tipo);
    const dia=DIAS[new Date(p.a,p.m,p.d).getDay()];
    return '<article class="ev"><div class="date" style="background:'+t.c+';color:'+t.t+'"><b>'+String(p.d).padStart(2,'0')+'</b><small>'+dia+'</small></div><div><h3>'+esc(e.titulo)+'</h3><p>'+[e.hora&&e.hora+' h',e.lugar].filter(Boolean).map(esc).join(' · ')+'</p>'+(e.detalle?'<p>'+esc(e.detalle)+'</p>':'')+'<span class="badge"><i style="background:'+t.c+'"></i>'+t.n+'</span>'+pintarEnlaces(e.enlaces)+'</div></article>';
  }).join(''):'<p class="empty">'+(sel?'Ese día no hay nada previsto.':'Este mes no hay eventos programados.')+'</p>';
}

document.getElementById('dias').addEventListener('click',ev=>{
  const b=ev.target.closest('.day[data-k]'); if(!b) return;
  sel=(sel===b.dataset.k)?null:b.dataset.k; pintar();
});
document.getElementById('ver-mes').addEventListener('click',()=>{sel=null;pintar();});
document.getElementById('prev').addEventListener('click',()=>{mes--;if(mes<0){mes=11;anio--;}sel=null;pintar();});
document.getElementById('next').addEventListener('click',()=>{mes++;if(mes>11){mes=0;anio++;}sel=null;pintar();});
pintarLeyenda(); pintar();
// Los retos salen de la tabla retos: cada uno se pinta solo el día de inicio, sin hora.
// Las fechas son texto 'AAAA-MM-DD' y se leen por partes, así que la zona horaria no las mueve.
const comoEvento=r=>{
  const p=r.plazo?partes(r.plazo):null;
  return {fecha:r.inicio,hora:'',titulo:r.titulo||tipo('reto').n,tipo:'reto',lugar:'Instagram',
    detalle:p?'Plazo: hasta el '+p.d+' de '+MESES[p.m].toLowerCase()+'.':''};
};
// De los documentos de un evento solo se muestran los enlaces de interés (formato URL), por su orden,
// y solo si empiezan por https:// (si no, no se pintan como enlace). Un enlace sin nombre usa uno genérico.
const enlacesDe=docs=>(docs||[]).filter(d=>d.formato==='URL'&&/^https:\/\//i.test(String(d.url||'').trim()))
  .sort((a,b)=>(a.orden??Infinity)-(b.orden??Infinity)).map(d=>({nombre:d.nombre||'Enlace de interés',url:String(d.url).trim()}));
// Los datos solo se leen con sesión de socio. La hora llega como "19:30:00" y se muestra "19:30".
// Los eventos de tipo reto se ignoran: los retos vienen solo de la tabla retos.
Cueva.cargar(document.getElementById('lista'),
  ()=>Cueva.privada().then(({sb})=>Promise.all([
    sb.from('eventos').select('fecha,hora,titulo,tipo,lugar,detalle,documentos(nombre,url,formato,orden)').order('fecha'),
    sb.from('retos').select('titulo,mes,inicio,plazo,palabras,incluir,nota').order('inicio')
  ])).then(([ev,re])=>({error:ev.error||re.error,data:{eventos:ev.data||[],retos:re.data||[]}})),
  ({eventos,retos})=>{
    EVENTOS=eventos.filter(e=>e.fecha&&e.tipo!=='reto').map(e=>Object.assign({},e,{hora:e.hora?String(e.hora).slice(0,5):'',enlaces:enlacesDe(e.documentos)}))
      .concat(retos.filter(r=>r.inicio).map(comoEvento));
    cargado=true; pintar();
  });
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
