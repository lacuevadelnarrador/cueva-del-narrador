<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retos · Administración · La Cueva del Narrador</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#528A93">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="pagehead">
    <div class="top">
      <div class="brand">
        <img src="img/logo-arco.png" alt="Logo de La Cueva del Narrador">
        <span>La Cueva<br>del Narrador</span>
      </div>
      <div class="avatar" aria-label="Tu perfil"></div>
    </div>
    <h1>Retos</h1>
    <p class="sub">Administración de los retos del mes.</p>
  </header>

  <main>
    <a class="volver" href="admin.html">&#8249; Volver al panel</a>

    <p class="pista">Cada reto aparece solo en el calendario el día de inicio.</p>

    <section id="vista-lista" aria-label="Lista de retos">
      <div class="barra-admin">
        <p class="cuenta" id="cuenta" aria-live="polite"></p>
        <button type="button" class="btn" id="anadir" hidden>+ Añadir</button>
      </div>
      <div id="lista"></div>
    </section>

    <section id="vista-form" hidden>
      <form class="card formulario" id="form" novalidate>
        <h2 id="form-titulo" tabindex="-1" data-foco>Nuevo reto</h2>
        <p class="msg" data-estado hidden></p>
        <div class="campo">
          <label for="titulo">Título</label>
          <input class="entrada" id="titulo" name="titulo" type="text" required autocomplete="off">
        </div>
        <div class="campo">
          <label for="mes">Mes</label>
          <input class="entrada" id="mes" name="mes" type="text" required autocomplete="off" placeholder="Por ejemplo: Octubre 2026">
        </div>
        <div class="campo">
          <label for="inicio">Empieza el</label>
          <input class="entrada" id="inicio" name="inicio" type="date" required>
        </div>
        <div class="campo">
          <label for="plazo">Plazo hasta el</label>
          <input class="entrada" id="plazo" name="plazo" type="date" required>
        </div>
        <div class="campo">
          <label for="palabras">Número de palabras</label>
          <input class="entrada" id="palabras" name="palabras" type="number" inputmode="numeric" min="1" step="1" required>
        </div>
        <div class="campo">
          <label for="incluir">Palabras o elementos que hay que incluir</label>
          <textarea class="entrada" id="incluir" name="incluir" required aria-describedby="incluir-pista"></textarea>
          <p class="pista" id="incluir-pista">Escribe uno por línea. Las líneas vacías no se guardan.</p>
        </div>
        <div class="campo">
          <label for="nota">Nota</label>
          <textarea class="entrada" id="nota" name="nota"></textarea>
        </div>
        <div class="botones-form">
          <button type="submit" class="btn">Guardar</button>
          <button type="button" class="btn sec" data-cancelar>Cancelar</button>
          <button type="button" class="btn peligro" id="borrar" hidden>Borrar</button>
        </div>
      </form>
    </section>
  </main>

  <nav class="nav" aria-label="Navegación principal">
    <a href="inicio.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V11a8 8 0 0116 0v10M9 21v-6a3 3 0 016 0v6"/></svg>Inicio</a>
    <a href="calendario.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</a>
    <a href="curso.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v13"/></svg>Curso</a>
    <a href="biblioteca.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h4v18H5zM11 3h4v18h-4zM17 5l3.5 1-4 15-3.5-1z"/></svg>Biblioteca</a>
    <a href="mas.html" class="on" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Más</a>
  </nav>
</div>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="admin.js"></script>
<script>
const esc=Admin.esc, el=id=>document.getElementById(id), form=el('form');
let RETOS=[], editando=null;

function pintar(){
  el('cuenta').textContent=RETOS.length+(RETOS.length===1?' reto':' retos');
  el('lista').innerHTML=RETOS.length?RETOS.map(r=>{
    const meta=['Empieza el '+Admin.fecha(r.inicio),r.plazo&&'plazo hasta el '+Admin.fecha(r.plazo),r.palabras&&r.palabras+' palabras',r.mes].filter(Boolean).map(esc).join(' · ');
    return '<button type="button" class="fila" data-id="'+esc(r.id)+'"><span class="tp" style="background:#A9DDE2" aria-hidden="true"></span><span class="st"><b>'+esc(r.titulo)+'</b><small>'+meta+'</small></span></button>';
  }).join(''):'<p class="empty">Todavía no hay retos.</p>';
}

// Del más reciente al más antiguo, por fecha de inicio.
function cargarLista(){
  Cueva.cargar(el('lista'),
    ()=>Admin.iniciar().then(sb=>sb.from('retos').select('id,titulo,mes,inicio,plazo,palabras,incluir,nota').order('inicio',{ascending:false})),
    filas=>{RETOS=filas;el('anadir').hidden=false;pintar();});
}

function abrirForm(r){
  editando=r||null;
  el('form-titulo').textContent=r?'Editar reto':'Nuevo reto';
  el('borrar').hidden=!r;
  Admin.rellenar(form,r?{titulo:r.titulo,mes:r.mes,inicio:r.inicio,plazo:r.plazo,palabras:r.palabras,incluir:(r.incluir||[]).join('\n'),nota:r.nota}
    :{titulo:'',mes:'',inicio:'',plazo:'',palabras:'',incluir:'',nota:''});
  Admin.abrir('vista-form');
}

el('anadir').addEventListener('click',()=>abrirForm(null));
el('lista').addEventListener('click',e=>{
  const b=e.target.closest('.fila'); if(!b) return;
  const r=RETOS.find(x=>String(x.id)===b.dataset.id); if(r) abrirForm(r);
});

form.addEventListener('submit',async e=>{
  e.preventDefault();
  const v=n=>form.elements[n].value.trim();
  // Las fechas son 'AAAA-MM-DD': se pueden comparar como texto.
  if(!Admin.validar(form,()=>v('plazo')&&v('inicio')&&v('plazo')<v('inicio')?{plazo:'El plazo no puede ser anterior a la fecha de inicio.'}:{})) return;
  const fila={titulo:Admin.texto(v('titulo')),mes:Admin.texto(v('mes')),inicio:v('inicio'),plazo:Admin.texto(v('plazo')),
    palabras:v('palabras')?parseInt(v('palabras'),10):null,
    incluir:v('incluir').split('\n').map(x=>x.trim()).filter(Boolean),
    nota:Admin.texto(v('nota'))};
  const sb=Admin.sb(), id=editando&&editando.id;
  const ok=await Admin.escribir(form,
    ()=>id?sb.from('retos').update(fila).eq('id',id).select('id'):sb.from('retos').insert(fila).select('id'),
    id?'Reto actualizado.':'Reto añadido.');
  if(ok){Admin.cerrar();cargarLista();}
});

el('borrar').addEventListener('click',async()=>{
  if(!editando) return;
  const si=await Admin.confirmar('Se borrará el reto «'+editando.titulo+'». Esta acción no se puede deshacer.');
  if(!si) return;
  const sb=Admin.sb(), id=editando.id;
  const ok=await Admin.escribir(form,()=>sb.from('retos').delete().eq('id',id).select('id'),'Reto borrado.');
  if(ok){Admin.cerrar();cargarLista();}
});

Admin.obligatorios(form);
cargarLista();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
