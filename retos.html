<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retos · La Cueva del Narrador</title>
<meta name="theme-color" content="#528A93">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-acceso="publico">
<div class="app">
  <header class="pagehead">
    <div class="top">
      <div class="brand">
        <img src="img/logo-arco.png" alt="Logo de La Cueva del Narrador">
        <span>La Cueva<br>del Narrador</span>
      </div>
      <div class="avatar" aria-label="Tu perfil" data-solo="socio" hidden></div>
    </div>
    <h1>Retos</h1>
    <p class="sub">Escribe, súbelo y etiquétanos.</p>
  </header>

  <main>
    <section id="actual" aria-label="Reto actual"></section>

    <section aria-label="Cómo participar">
      <div class="sec-head"><h2>Cómo participar</h2></div>
      <ol class="pasos">
        <li>Escribe tu texto siguiendo las condiciones del reto.</li>
        <li>Súbelo a Instagram.</li>
        <li>Etiquétanos para que podamos leerte.</li>
      </ol>
    </section>

    <section aria-label="Retos anteriores">
      <div class="sec-head"><h2>Retos anteriores</h2></div>
      <div id="anteriores"></div>
    </section>
  </main>

  <nav class="nav visitante" aria-label="Navegación principal">
    <a href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V11a8 8 0 0116 0v10M9 21v-6a3 3 0 016 0v6"/></svg>Inicio</a>
    <a href="retos.html" class="on" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Retos</a>
    <a href="acceso.html" class="acceso"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Acceso</a>
    <a href="nuestra-biblioteca.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h4v18H5zM11 3h4v18h-4zM17 5l3.5 1-4 15-3.5-1z"/></svg>Nuestra biblioteca</a>
    <a href="mas.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Más</a>
  </nav>
</div>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
const esc=Cueva.esc;
const h=new Date();
const hoy=h.getFullYear()+'-'+String(h.getMonth()+1).padStart(2,'0')+'-'+String(h.getDate()).padStart(2,'0');
const fecha=f=>new Date(f+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long'});
const plazoTxt=r=>!r.plazo?'':(r.plazo>=hoy?'Plazo: hasta el '+fecha(r.plazo)+'.':'El plazo terminó el '+fecha(r.plazo)+'.');
const condiciones=r=>(r.palabras?'Escribe '+r.palabras+' palabras':'Escribe tu texto')+((r.incluir||[]).length?' que incluyan:':'.');

// Los retos son públicos: se leen sin sesión. Solo se piden los que ya han empezado.
function pintar(RETOS){
const orden=RETOS.slice().sort((a,b)=>b.inicio.localeCompare(a.inicio));
const actual=orden.find(r=>r.inicio<=hoy);
const anteriores=orden.filter(r=>r!==actual&&r.inicio<=hoy);

document.getElementById('actual').innerHTML=actual
 ?'<div class="reto-card"><span class="etq">Reto actual</span><h2>'+esc(actual.titulo)+'</h2><p class="rule">'+esc(condiciones(actual))+'</p>'+((actual.incluir||[]).length?'<ul class="words">'+actual.incluir.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+(actual.nota?'<p class="notar">'+esc(actual.nota)+'</p>':'')+'<p class="plazo">'+esc(plazoTxt(actual))+'</p>'+ '<a class="btn" href="https://www.instagram.com/lacuevadelnarrador/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor"/></svg>Súbelo a Instagram y etiquétanos</a>' +'</div>'
 :'<p class="empty">Todavía no hay ningún reto en marcha. ¡Muy pronto!</p>';

document.getElementById('anteriores').innerHTML=anteriores.length?anteriores.map(r=>
 '<details class="charla"><summary><span class="tp" style="background:#A9DDE2" aria-hidden="true"></span><span class="st"><b>'+esc(r.titulo)+'</b><small>'+esc(r.mes)+'</small></span></summary><div class="cuerpo"><p class="tema">'+esc(condiciones(r))+'</p>'+((r.incluir||[]).length?'<ul class="words">'+r.incluir.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+(r.nota?'<p class="tema">'+esc(r.nota)+'</p>':'')+'</div></details>').join('')
 :'<p class="empty">Aún no hay retos anteriores.</p>';
}
document.getElementById('anteriores').innerHTML='';
Cueva.cargar(document.getElementById('actual'),
  ()=>Cueva.cliente().then(sb=>sb.from('retos').select('titulo,mes,inicio,plazo,palabras,incluir,nota').lte('inicio',hoy).order('inicio',{ascending:false})),
  pintar);
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
